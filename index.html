<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blurt Ludo World</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Header: Profile and Currency -->
        <div class="top-bar">
            <div class="profile">
                <img src="https://images.blurt.blog/u/mamun123456/avatar" alt="Avatar" class="avatar">
                <div class="user-level">7</div>
            </div>
            <div class="stats">
                <div class="stat-item gold"><i class="fas fa-coins"></i> <span id="blurt-balance">35</span></div>
                <div class="stat-item blue"><i class="fas fa-gem"></i> <span>20</span></div>
                <div class="stat-item green"><i class="fas fa-ticket-alt"></i> <span>52</span></div>
            </div>
        </div>

        <!-- Utility Buttons Grid -->
        <div class="action-grid">
            <button class="action-btn">REWARD</button>
            <button class="action-btn">SHOP</button>
            <button class="action-btn">LEADERBOARD</button>
            <button class="action-btn">HISTORY</button>
        </div>

        <!-- Online Friends Bar -->
        <div class="friends-bar">
            <span>Friends Online: 0</span>
            <button class="add-friend">+ Add</button>
        </div>

        <!-- Game Modes Section -->
        <div class="game-modes">
            <!-- Mode 1 -->
            <div class="mode-card private" onclick="openRoom()">
                <div class="mode-info">
                    <h2>Private Table</h2>
                    <p>CREATE ROOM</p>
                </div>
                <img src="https://img.freepik.com/free-vector/anime-style-character-design_23-2151015024.jpg" alt="Char" class="mode-img">
            </div>

            <!-- Mode 2 -->
            <div class="mode-card tournament">
                <div class="mode-info">
                    <h2>Tournament</h2>
                    <p>2vs2 TEAMS</p>
                </div>
                <img src="https://img.freepik.com/free-vector/hand-drawn-anime-character-illustration_23-2151000673.jpg" alt="Char" class="mode-img">
            </div>

            <!-- Mode 3 -->
            <div class="mode-card quick">
                <div class="mode-info">
                    <h2>Quick Match</h2>
                    <p>Play with BlurtX</p>
                </div>
                <img src="https://img.freepik.com/free-vector/hand-drawn-anime-character-illustration_23-2151000657.jpg" alt="Char" class="mode-img">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
