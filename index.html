<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blurt Exclusive Ludo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Blurt Ludo (Alpha)</h1>
        <div id="user-info">
            <input type="text" id="username" placeholder="Enter Blurt Username">
            <button onclick="login()">Login</button>
        </div>
        <div id="board-container">
            <!-- লুডু বোর্ড এখানে আসবে -->
            <div id="ludo-board"></div>
        </div>
        <button id="roll-dice" style="display:none;" onclick="rollDice()">Roll Dice</button>
        <p id="status"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
