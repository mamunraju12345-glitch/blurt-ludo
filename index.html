<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blurt Ludo Multiplayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>BLURT LUDO</h1>
        <div id="auth-box">
            <input type="text" id="username" placeholder="Blurt Username">
            <button onclick="loginWithKeychain()">Login with Keychain</button>
        </div>
        <p id="player-display"></p>
    </div>

    <div class="ludo-container">
        <div class="ludo-board" id="board">
            <!-- Board squares will be generated by JS -->
        </div>
    </div>

    <div class="controls">
        <div id="dice-result">0</div>
        <button id="roll-btn" onclick="rollDice()" disabled>Roll Dice</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
